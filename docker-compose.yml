services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tokenflow
      POSTGRES_PASSWORD: tokenflow
      POSTGRES_DB: tokenflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
